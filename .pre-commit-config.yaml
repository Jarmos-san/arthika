default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/weburz/crisp
    rev: v1.0.0
    hooks:
      - id: crisp
        name: lint commit messages

  - repo: local
    hooks:
      - id: oxfmt-check
        name: oxfmt check (client)
        entry: pnpm --prefix client fmt:check
        language: system
        files: ^client/
        types_or: [javascript, ts, tsx, vue, css, html, json, markdown]
        pass_filenames: false

      - id: oxlint
        name: oxlint (client)
        entry: pnpm --prefix client lint
        language: system
        files: ^client/
        types_or: [javascript, ts, tsx, vue]
        pass_filenames: false
