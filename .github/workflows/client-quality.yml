name: Client Quality Checks
on:
  pull_request:
    paths:
      - "client/**/*.vue"
      - "client/**/*.ts"
    branches: [main]

jobs:
  lint:
    name: Run Linters
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the Linters
        run: pnpm lint

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Type-Checking
        run: pnpm typecheck

  build:
    name: Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the build
        run: pnpm build
