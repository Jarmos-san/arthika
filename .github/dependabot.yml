version: 2
updates:
  # Server — Go modules
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns:
          - "*"

  # Client — npm
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      prod:
        dependency-type: production
      dev:
        dependency-type: development

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
