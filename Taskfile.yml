version: "3"

vars:
  DB_URL: sqlite3://db/arthika.db
  MIGRATIONS_DIR: db/migrations
  MIGRATE_INSTALL_TAGS: sqlite3
  MIGRATE_INSTALL_URL: github.com/golang-migrate/migrate/v4/cmd/migrate@latest

tasks:
  default:
    desc: Display all available commands
    cmd: task --list

  server:lint:
    desc: Run linters across the source code.
    dir: server
    cmd: golangci-lint run ./...

  sqlc:
    internal: true
    desc: Generate Go code from SQL queries using sqlc
    dir: server
    cmd: sqlc generate
    vars:
      SQLC_CONFIG_FILE: sqlc.yaml
      SQLC_GEN_CODE: internal/repository/**/*.go
      DB_QUERIES: db/query/**/*.sql
      DB_MIGRATIONS: db/migrations/**/*.sql
    sources:
      - "{{ .SQLC_CONFIG_FILE }}"
      - "{{ .DB_QUERIES }}"
      - "{{ .DB_MIGRATIONS }}"
    generates:
      - "{{ .SQLC_GEN_CODE }}"
    preconditions:
      - sh: which sqlc
        msg: >-
          sqlc not found. Install with: go install
          github.com/sqlc-dev/sqlc/cmd/sqlc@latest

  oapi:gen:
    desc: Generate source code from the OpenAPI spec.
    summary: |
      Generate type-safe and idiomic Go or TypeScript source code from the OpenAPI
      specification.
    cmds:
      - task: oapi:server
      - task: oapi:client

  oapi:server:
    internal: true
    desc: Generate Go server stubs from the OpenAPI spec.
    dir: server
    cmd: oapi-codegen -config oapi-codegen.yml api/openapi.yml
    vars:
      OAPI_CONFIG_FILE: oapi-codegen.yml
      OAPI_SPEC_FILE: api/openapi.yml
      OAPI_GEN_CODE: internal/api/server.gen.go
    sources:
      - "{{ .OAPI_CONFIG_FILE }}"
      - "{{ .OAPI_SPEC_FILE }}"
    generates:
      - "{{ .OAPI_GEN_CODE }}"
    preconditions:
      - sh: which oapi-codegen
        msg: >-
          oapi-codegen not found. Install with: go install
          github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest

  oapi:client:
    internal: true
    desc: Generate TypeScript client stubs (type definitions) from the OpenAPI spec.
    dir: client
    cmd: pnpm run openapi:generate
    sources: ["{{ .OAPI_SPEC_FILE }}"]
    generates: ["generated/**/*.ts"]
    preconditions:
      - sh: which pnpm
        msg: >-
          pnpm is not installed.

  server:generate:
    desc: Run all server code generators
    cmds:
      - task: sqlc
      - task: oapi-codegen

  server:test:
    desc: Run all server tests
    dir: server
    cmd: go test ./...

  server:run:
    desc: Start the server on :8000
    vars:
      SERVER_EXEC_PATH: ./server/cmd/server
    cmd: go run "{{ .SERVER_EXEC_PATH }}"

  client:install:
    desc: Install client dependencies
    dir: client
    cmd: pnpm install --frozen-lockfile
    status:
      - test -d node_modules
      - test -d .nuxt
    preconditions:
      - sh: which pnpm
        msg: "pnpm not found. Install from https://pnpm.io/installation"

  client:dev:
    desc: Start the Nuxt dev server
    dir: client
    cmd: pnpm dev
    preconditions:
      - sh: which pnpm
        msg: "pnpm not found. Install from https://pnpm.io/installation"

  client:build:
    desc: Build the client for production
    dir: client
    cmd: pnpm build
    status:
      - test -d .output
    preconditions:
      - sh: which pnpm
        msg: "pnpm not found. Install from https://pnpm.io/installation"

  client:typecheck:
    desc: Run vue-tsc type checking
    dir: client
    cmd: pnpm typecheck
    preconditions:
      - sh: which pnpm
        msg: "pnpm not found. Install from https://pnpm.io/installation"
      - sh: test -d .nuxt
        msg:
          The client-side application was not set up properly. Please run "task
          client:install" before running the command again.

  migrate:up:
    desc: Run pending up migrations
    dir: server
    cmd: migrate -path "{{ .MIGRATIONS_DIR }}" -database "{{ .DB_URL }}" up
    preconditions:
      - sh: which migrate
        msg: >-
          migrate binary not found. Install with: go install -tags '{{
          .MIGRATE_INSTALL_TAGS }}' {{ .MIGRATE_INSTALL_URL }}

  migrate:down:
    desc: Roll back all down migrations
    dir: server
    cmd: migrate -path {{ .MIGRATIONS_DIR }} -database "{{ .DB_URL }}" down -all
    preconditions:
      - sh: which migrate
        msg: >-
          migrate binary not found. Install with: go install -tags '{{
          .MIGRATE_INSTALL_TAGS }}' {{ .MIGRATE_INSTALL_URL }}

  migrate:reset:
    desc: Roll back then re-apply all migrations
    dir: server
    cmds:
      - task: migrate:down
      - task: migrate:up
