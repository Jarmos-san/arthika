openapi: "3.0.3"
info:
  title: Arthika API
  version: "0.1.0"
paths:
  /users/:
    get:
      operationId: GetUser
      summary: Retrieve the current user
      responses:
        "200":
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/register:
    post:
      operationId: RegisterUser
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /login:
    post:
      operationId: LoginUser
      summary: Authenticate and retrieve a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUserRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
components:
  schemas:
    User:
      type: object
      required: [name]
      properties:
        name:
          type: string
    RegisterUserRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      additionalProperties: false
    LoginUserRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      additionalProperties: false
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: number
      additionalProperties: false
