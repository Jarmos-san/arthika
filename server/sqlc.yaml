version: "2"
sql:
  - engine: "sqlite"
    schema: "db/migrations/"
    queries: "db/query/"
    gen:
      go:
        package: "repository"
        out: "internal/repository/"
        emit_interface: true
        emit_sql_as_comment: true
        json_tags_id_uppercase: true
        json_tags_case_style: "camel"
        overrides:
          - column: "users.password_hash"
            go_struct_tag: 'json:"-"'
